# ==============================================================================
# Test Profile Configuration (Isolated In-Memory H2 Database)
# ==============================================================================

server.port=8080
spring.application.name=devops-student-management-test

# Use H2 in-memory DB so tests never depend on an external running MySQL server
spring.datasource.url=jdbc:h2:mem:studenttestdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
