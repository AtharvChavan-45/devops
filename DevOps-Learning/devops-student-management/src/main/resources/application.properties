# ==============================================================================
# DevOps Student Management System - Application Configuration
# ==============================================================================

server.port=8080
spring.application.name=devops-student-management

# Database Configuration with Dynamic Environment Variable Fallbacks
# Pattern: ${ENV_VAR_NAME:default_value}
# This allows running locally with localhost, inside Docker Compose with mysql-db, or in Kubernetes
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate ORM Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging Settings
logging.level.root=INFO
logging.level.com.devops.studentmanagement=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
