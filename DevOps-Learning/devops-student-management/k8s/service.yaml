# ==============================================================================
# Kubernetes Service for DevOps Student Management System
# Exposes application Pods via NodePort for local access on MacBook (Docker Desktop K8s)
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: student-management-service
  labels:
    app: student-management
spec:
  type: NodePort
  selector:
    app: student-management
  ports:
    - protocol: TCP
      port: 8080         # Port exposed inside the cluster
      targetPort: 8080   # Port on the container inside the Pod
      nodePort: 30080    # Fixed port accessible on localhost:30080 on macOS Docker Desktop
---
# ==============================================================================
# Optional: MySQL Service & Deployment for running Database inside Kubernetes
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  labels:
    app: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-deployment
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: "rootpassword"
        - name: MYSQL_DATABASE
          value: "studentdb"
        ports:
        - containerPort: 3306
